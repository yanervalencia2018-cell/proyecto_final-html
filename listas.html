<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon por tipo</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', sans-serif; }
        body { background: #f0f2f5; padding: 2rem 1.5rem; }
        .container { max-width: 1400px; margin: 0 auto; }
        .back-btn {
            background: #2d3748;
            border: none;
            padding: 0.6rem 1.4rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 2rem;
            transition: 0.2s;
        }
        .back-btn:hover { background: #1e293b; transform: translateX(-3px); }
        .header { text-align: center; margin-bottom: 2rem; }
        .header h1 { font-size: 2rem; color: #1e293b; }
        .type-badge { background: #ffd966; padding: 0.2rem 1rem; border-radius: 40px; display: inline-block; margin-top: 0.5rem; text-transform: capitalize; }
        .grid-cards {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 1.8rem;
        }
        .card {
            background: white;
            border-radius: 1.5rem;
            overflow: hidden;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 16px 24px rgba(0,0,0,0.12); }
        .card-img { background: #f8f9fc; padding: 1rem; text-align: center; height: 180px; display: flex; align-items: center; justify-content: center; }
        .card-img img { max-width: 140px; max-height: 140px; object-fit: contain; }
        .card-content { padding: 1rem; text-align: center; }
        .card-content h3 { text-transform: capitalize; font-size: 1.3rem; }
        .number { color: #6c757d; font-size: 0.8rem; margin-top: 0.3rem; }
        .loading, .error { text-align: center; padding: 2rem; font-size: 1.1rem; }
        .spinner { border: 5px solid #e2e8f0; border-top: 5px solid #f97316; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        footer { text-align: center; margin-top: 3rem; color: #6c757d; }
    </style>
</head>
<body>
<div class="container">
    <button class="back-btn" id="backBtn">← Volver a tipos</button>
    <div class="header">
        <h1>Pokémon de tipo <span id="typeNameSpan" style="text-transform:capitalize;"></span></h1>
        <div class="type-badge" id="typeBadge"></div>
    </div>
    <div id="pokemonGrid" class="grid-cards">
        <div class="loading"><div class="spinner"></div><p>Cargando Pokémon...</p></div>
    </div>
    <footer>✨ Haz clic en cualquier Pokémon para ver sus características ✨</footer>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const type = urlParams.get('type');
    if (!type) window.location.href = 'tipos.html';

    document.getElementById('typeNameSpan').innerText = type;
    document.getElementById('typeBadge').innerText = type + ' type';
    const grid = document.getElementById('pokemonGrid');

    async function loadPokemonsByType() {
        try {
            const res = await fetch(`https://pokeapi.co/api/v2/type/${type.toLowerCase()}`);
            if (!res.ok) throw new Error('Tipo no encontrado');
            const data = await res.json();
            const entries = data.pokemon;
            const pokemonList = entries.map(entry => {
                const url = entry.pokemon.url;
                const parts = url.split('/').filter(p => p);
                const id = parts[parts.length - 1];
                return { name: entry.pokemon.name, id };
            });
            pokemonList.sort((a,b) => a.id - b.id);
            grid.innerHTML = '';
            for (const p of pokemonList) {
                const sprite = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/${p.id}.png`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img">
                        <img src="${sprite}" alt="${p.name}" loading="lazy" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png'">
                    </div>
                    <div class="card-content">
                        <h3>${p.name}</h3>
                        <div class="number">#${String(p.id).padStart(3,'0')}</div>
                    </div>
                `;
                card.addEventListener('click', () => {
                    window.location.href = `detalle.html?name=${encodeURIComponent(p.name)}`;
                });
                grid.appendChild(card);
            }
        } catch (error) {
            grid.innerHTML = `<div class="error">❌ ${error.message}. Intenta de nuevo.</div>`;
        }
    }
    document.getElementById('backBtn').addEventListener('click', () => {
        window.location.href = 'tipos.html';
    });
    loadPokemonsByType();
</script>
</body>
</html>
