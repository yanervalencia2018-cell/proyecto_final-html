<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle Pokémon</title>
   <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <button class="back-btn" id="backBtn">← Regresar</button>
    <div id="detailContent">
        <div class="loading"><div class="spinner"></div><p>Cargando datos del Pokémon...</p></div>
    </div>
    <footer>⚡ Datos oficiales de PokéAPI ⚡</footer>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const pokemonName = params.get('name');
    if (!pokemonName) window.location.href = 'tipos.html';

    const container = document.getElementById('detailContent');

    async function loadPokemonDetail() {
        try {
            const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pokemonName.toLowerCase()}`);
            if (!res.ok) throw new Error('Pokémon no encontrado');
            const p = await res.json();
            const sprite = p.sprites.other?.['official-artwork']?.front_default || p.sprites.front_default || `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
            const types = p.types.map(t => t.type.name);
            const abilities = p.abilities.map(a => a.ability.name);
            const stats = p.stats.map(s => ({ name: s.stat.name, value: s.base_stat }));
            
            const html = `
                <div class="detail-card">
                    <div class="hero">
                        <img src="${sprite}" alt="${p.name}" onerror="this.src='https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png'">
                        <h2>${p.name}</h2>
                        <div class="types">
                            ${types.map(t => `<span class="type-badge">${t}</span>`).join('')}
                        </div>
                        <span style="background:rgba(0,0,0,0.2); padding:0.2rem 1rem; border-radius:30px;">N.º ${String(p.id).padStart(3,'0')}</span>
                    </div>
                    <div class="info-section">
                        <div class="stats-grid">
                            <h3 style="grid-column:1/-1;">📊 Estadísticas base</h3>
                            ${stats.map(stat => `
                                <div class="stat-card">
                                    <div class="stat-name">${stat.name.replace('-',' ')}</div>
                                    <div class="stat-value">${stat.value}</div>
                                </div>
                            `).join('')}
                        </div>
                        <div class="abilities">
                            <h3>🌀 Habilidades</h3>
                            <div class="ability-list">
                                ${abilities.map(ab => `<span class="ability-item">${ab}</span>`).join('')}
                            </div>
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        } catch (err) {
            container.innerHTML = `<div class="error">❌ Error: ${err.message}<br><button class="back-btn" style="margin-top:1rem;" onclick="window.location.href='tipos.html'">Ir a inicio</button></div>`;
        }
    }
    document.getElementById('backBtn').addEventListener('click', () => {
        // Intentar volver a la lista del tipo anterior (si se guardó en sessionStorage)
        const prevType = sessionStorage.getItem('lastSelectedType');
        if (prevType) window.location.href = `lista.html?type=${encodeURIComponent(prevType)}`;
        else window.location.href = 'tipos.html';
    });
    // Guardar el tipo actual si venimos de lista.html (al hacer clic desde allí, podemos pasar el tipo por URL o sessionStorage)
    // Para mejorar la experiencia, recuperamos el tipo referer desde document.referrer? opcional
    // De forma sencilla: si la página anterior es lista.html, el tipo puede ir en sessionStorage.
    // Simplemente comprobamos si existe un tipo en localStorage/sessionStorage, pero si no, el botón "Regresar" va a tipos.
    // Para que funcione perfecto, en lista.html antes de redirigir a detalle guardamos el tipo actual:
    // Pero ya que no modificamos lista.html, podemos leer el referer y extraer el tipo si contiene 'lista.html?type=...'
    const referrer = document.referrer;
    if (referrer.includes('lista.html') && referrer.includes('type=')) {
        const match = referrer.match(/type=([^&]+)/);
        if (match) sessionStorage.setItem('lastSelectedType', decodeURIComponent(match[1]));
    }
    loadPokemonDetail();
</script>
</body>
</html>
